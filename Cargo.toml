[package]
name = "sesstui"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "浏览、筛选与删除本机 AI 编码客户端的会话"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
libc = "0.2"
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
ruzstd = "0.9.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
unicode-width = "0.2"

[[bin]]
name = "sesstui"
path = "src/main.rs"

[profile.release]
strip = true
lto = true
